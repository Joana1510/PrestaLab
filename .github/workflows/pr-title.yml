name: PR Título

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [develop, main]

permissions:
  contents: read

jobs:
  titulo:
    name: Título del PR (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Validar título
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          regex='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .{3,}$'
          if [[ "$TITULO" =~ $regex ]]; then
            echo "Título válido: $TITULO"
          else
            echo "::error::El título debe seguir Conventional Commits, por ejemplo: feat(loans): registrar préstamo con foto"
            exit 1
          fi